<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Bootstrap demo</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Elms+Sans:ital,wght@0,100..900;1,100..900&family=Google+Sans+Flex:opsz,wght@6..144,1..1000&family=Michroma&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="./root.css">
    <link rel="stylesheet" href="./index.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <title>Contactos</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="contactos.css">
</head>

<body>

    <main class="container py-5">

        <h1 class="text-center mb-4">
            <img src="../../Assets/Images/logo/spawn-point-logo.webp" alt="Spawn Point" class="logo">
        </h1>


        <div class="row justify-content-center">

            <div class="col-md-8">

                <div class="card p-4">

                    <h2 class="mb-4">Tenes alguna consulta para nosotros: </h2>

                    <form>

                        <div class="mb-3">
                            <label for="nombre" class="form-label">
                                Nombre
                            </label>

                            <input type="text" class="form-control" id="nombre" placeholder="Ingresá tu nombre">
                        </div>

                        <div class="mb-3">
                            <label for="email" class="form-label">
                                Email
                            </label>

                            <input type="email" class="form-control" id="email" placeholder="Ingresá tu email">
                        </div>

                        <div class="mb-3">
                            <label for="telefono" class="form-label">
                                Teléfono
                            </label>

                            <input type="tel" class="form-control" id="telefono" placeholder="Ingresá tu teléfono">
                        </div>

                        <div class="mb-3">
                            <label for="mensaje" class="form-label">
                                Mensaje
                            </label>

                            <textarea class="form-control" id="mensaje" rows="5"
                                placeholder="Escribí tu mensaje"></textarea>

                            <div class="text-center">
                                <button type="submit" class="btn btn-primary my-4">
                                    Enviar
                                </button>
                            </div>

                    </form>

                </div>

            </div>

        </div>
        <h3 class="titulo de mapa text-center fs-5 "> Podes encontrarnos en:</h3>
        <hr class="text-white">
        <iframe class="mapa "
            src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3560.1059174722645!2d-65.20974192476652!3d-26.836583276692632!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x94225d3ad7f30f1d%3A0xf8606cd659b8e3e4!2sRollingCode%20School!5e0!3m2!1ses-419!2sar!4v1787258957733!5m2!1ses-419!2sar"
            width="450" height="450" style="border:0;" allowfullscreen="" loading="lazy"
            referrerpolicy="strict-origin-when-cross-origin"></iframe>

        </div>

    </main>

</body>

</html>
