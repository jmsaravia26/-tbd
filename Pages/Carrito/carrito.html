<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Carrito | Spawn Point</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <link rel="stylesheet" href="../Carrito/carrito.css">
</head>

<body>

    <main class="container py-5">

        <section class="text-center mb-5">
            <h1 class="titulo-carrito">Carrito de compras</h1>
            <p class="subtitulo">Spawn Point</p>
        </section>


        <div class="row g-4">

            <section class="col-lg-8">

                <div class="card carrito-card">

                    <div class="card-header encabezado-card">
                        <h2>Mis productos</h2>
                        <span class="cantidad-productos">2 productos</span>
                    </div>


                    <div class="card-body">

                        <article class="producto">

                            <div class="row align-items-center g-3">

                                <div class="col-md-3">
                                    <img
                                        src="../../Assets/Images/categorias-productos/cooperativos-online/meccha-chameleon/header-meccha-chameleon.webp"
                                        class="img-fluid imagen-producto"
                                        alt="carrito-producto-meccha-chameleon"
                                    >
                                </div>

                                <div class="col-md-4">
                                    <h3>Meccha Chameleon</h3>
                                    <p>
                                        Videojuego para PC
                                    </p>
                                </div>

                                <div class="col-md-2">
                                    <span class="precio">$25.000</span>
                                </div>

                                <div class="col-md-3">

                                    <label class="cantidad-label">
                                        Cantidad
                                    </label>

                                    <div class="input-group">

                                        <button
                                            class="btn btn-cantidad"
                                            type="button"
                                        >
                                            −
                                        </button>

                                        <input
                                            type="text"
                                            class="form-control cantidad"
                                            value="1"
                                            readonly
                                        >

                                        <button
                                            class="btn btn-cantidad"
                                            type="button"
                                        >
                                            +
                                        </button>

                                    </div>

                                </div>

                            </div>

                        </article>

                        <article class="producto">

                            <div class="row align-items-center g-3">

                                <div class="col-md-3">

                                    <img
                                        src="../../Assets/Images/categorias-productos/rpg/Diablo IV/header-diablo-iv.webp"
                                        class="img-fluid imagen-producto"
                                        alt="carrito-producto-diablo-iv"
                                    >

                                </div>

                                <div class="col-md-4">

                                    <h3>Diablo IV</h3>

                                    <p>
                                        Videojuego para PlayStation
                                    </p>

                                </div>

                                <div class="col-md-2">

                                    <span class="precio">$30.000</span>

                                </div>

                                <div class="col-md-3">

                                    <label class="cantidad-label">
                                        Cantidad
                                    </label>

                                    <div class="input-group">

                                        <button
                                            class="btn btn-cantidad"
                                            type="button"
                                        >
                                            −
                                        </button>

                                        <input
                                            type="text"
                                            class="form-control cantidad"
                                            value="1"
                                            readonly
                                        >

                                        <button
                                            class="btn btn-cantidad"
                                            type="button"
                                        >
                                            +
                                        </button>

                                    </div>

                                </div>

                            </div>

                        </article>

                    </div>

                </div>

            </section>

            <aside class="col-lg-4">

                <div class="card resumen-card">

                    <div class="card-header encabezado-card">

                        <h2>Resumen de compra</h2>

                    </div>


                    <div class="card-body">

                        <div class="fila-resumen">

                            <span>Productos</span>

                            <span>2</span>

                        </div>


                        <div class="fila-resumen">

                            <span>Subtotal</span>

                            <span>$55.000</span>

                        </div>


                        <div class="fila-resumen">

                            <span>Envío</span>

                            <span>Gratis</span>

                        </div>


                        <hr>


                        <div class="total">

                            <span>Total</span>

                            <strong>$55.000</strong>

                        </div>


                        <button
                            type="button"
                            class="btn btn-pago w-100 mt-4"
                        >
                            💳 Ver formas de pago
                        </button>


                        <button
                            type="button"
                            class="btn btn-finalizar w-100 mt-3"
                        >
                            Finalizar compra
                        </button>

                    </div>

                </div>

            </aside>

        </div>

    </main>

    <footer class="footer text-center">

        <p>
            © 2026 Spawn Point - Todos los derechos reservados
        </p>

    </footer>

</body>
</html>
